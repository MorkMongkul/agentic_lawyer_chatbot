# ── HTTP : serve ACME challenge + redirect everything to HTTPS ──
server {
    listen 80;
    server_name nitti.tech www.nitti.tech;

    # Let's Encrypt domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS : the real app ──
server {
    listen 443 ssl;
    server_name nitti.tech www.nitti.tech;

    ssl_certificate     /etc/letsencrypt/live/nitti.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nitti.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    # ── Serve the React SPA ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API calls to the backend container ──
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events) streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
