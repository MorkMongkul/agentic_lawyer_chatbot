services:
  backend:
    build: ./backend
    container_name: niti-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # Vertex AI config
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      # Service account key path (mounted below)
      GOOGLE_APPLICATION_CREDENTIALS: /app/sa-key.json
      # Database
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      # Mount the service account key (read-only) — never baked into the image
      - ./backend/sa-key.json:/app/sa-key.json:ro

  frontend:
    build: ./frontend
    container_name: niti-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      # Mount nginx config so it can be changed without rebuilding the image
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt certificates + ACME challenge webroot
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    container_name: niti-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
